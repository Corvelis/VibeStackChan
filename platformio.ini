[platformio]
default_envs = m5stack-cores3

[vibestackchan]
version = 0.1.0

[env:m5stack-cores3]
platform = espressif32 @ 6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
custom_firmware_version = ${vibestackchan.version}

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D UART_SCLK_DEFAULT=UART_SCLK_APB
  -D STACKCHAN_DEVICE_CORES3=1
  -D VIBESTACKCHAN_FIRMWARE_VERSION=\"${vibestackchan.version}\"
  -std=gnu++17

build_unflags =
  -std=gnu++11

build_src_filter =
  -<*>
  +<main.cpp>
  +<VibeStackChanApp.cpp>
  +<Sound.cpp>

lib_deps =
  m5stack/M5Unified @ 0.2.18
  m5stack/M5GFX @ 0.2.25
  bblanchon/ArduinoJson @ 7.4.3
  h2zero/NimBLE-Arduino @ 2.5.0
  https://github.com/m5stack/StackChan-BSP.git#f7ed40e6f5d9a1d08440cb926f3a0865b81882f8

[env:m5stack-cores3-release]
extends = env:m5stack-cores3
extra_scripts =
  post:scripts/package_release.py
